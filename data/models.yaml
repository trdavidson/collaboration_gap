# Model registry for src/models/.
#
# Each top-level key is the `model_name` you pass to LMFactory. Its value is a
# list of candidate deployments; `lookup_model_details` filters that list to the
# requested provider and, among the survivors, picks the one with the highest
# AggregatedRequestRate.
#
# Per-entry fields:
#   DeploymentName   (required) the identifier sent to the provider's API
#   ModelBuilder     (required) who trained the model
#   Provider         (required) which adapter serves it; must match a value of
#                    ProviderAPI in src/models/adapters.py. Never omit this --
#                    lookup_model_details indexes it directly and a missing key
#                    raises KeyError.
#   ReasoningSupport (optional, default false) whether the deployment accepts
#                    reasoning controls. When false, LMFactory silently clears
#                    LMConfig.reasoning_effort / reasoning_summary.
#   AggregatedRequestRate / RequestRateWindow (optional) requests per window,
#                    used only to rank duplicate deployments.
#
# On ReasoningSupport: the OpenAI adapter sends a reasoning effort as
# `reasoning.effort` on /v1/responses, and the Google adapter as `thinkingLevel`,
# which only Gemini 3+ accepts. The other adapters do not send one. Only OpenAI
# reasoning models carry the flag here: it is deliberately left false for models
# that reason internally but take no such parameter (e.g. Gemini 2.5, the Cohere
# reasoning variants, DeepSeek R1), since setting it would make LMFactory send a
# parameter the endpoint rejects.
#
# Note also that OpenAI reasoning models reject `temperature` outright,
# whether or not a reasoning effort is supplied. LMFactory clears it for any
# deployment flagged here, so do not flag a model that still needs
# temperature control.

