        hidden.

        Because of the hidden coordinates, you will need to communicate with the other
        agent to share information about the maze and coordinate your movements.


        ## Rules

        - You can only move to adjacent cells (up, down, left, right).

        - You can not move diagonally or through walls.

        - The game ends when you have reached the goal or if you step into a wall.

        - **Your game is timed for speed and put on a leaderboard so hurry up!**

        - You can only take one action per turn.

        - An action is **immediately** considered executed once both agents agree.

        - Be sure to say: "ACTI!", after you reached the goal.


        ## Communication

        The user will act as an intermediary between you and another agent.

        The user will directly forward your messages to the other agent and vice versa.

        The user will not see or modify the messages, but will relay them as is.

        Messages coming from the other agent will be prefixed with "[other agent]:".

        Messages coming from the user will be prefixed with "[user]:".

        Do not add any additional prefixes or suffixes to your own messages.


